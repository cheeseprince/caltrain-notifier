# Weekly timetable-expiry watch.
#
# The PR-time "Timetable freshness" check in ci.yml is visible but not a
# required merge gate -- its result depends on Caltrain publishing a newer
# GTFS feed, not on the PR under test (see tools/check_timetable_freshness.py
# for the full rationale). That leaves a gap: with no PRs open, nobody sees it
# go red. This job closes the gap by running the SAME check on a schedule and
# opening a tracking issue when the 90-day window is closing.
#
# One open issue at a time: if a matching issue is already open, it is left
# alone rather than commented on weekly, so the warning stays a single item to
# act on instead of becoming noise. Close the issue when the headers are
# regenerated; if the window is still closing, next week's run reopens it as a
# new issue.
#
# Every action is pinned to a 40-character commit SHA, matching ci.yml.

name: Timetable watch

on:
  schedule:
    # Mondays 16:00 UTC (08:00/09:00 Pacific). Weekly is plenty for a 90-day
    # window; any finer just burns runner minutes.
    - cron: "0 16 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  watch:
    name: Timetable expiry watch
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write   # the only write this job needs: opening the tracking issue
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      # Capture the check's output to a file rather than interpolating it into
      # a later `run:` via ${{ }} -- the file is read as data by the shell, so
      # nothing in it can be evaluated as script.
      - name: Check timetable freshness
        id: check
        run: |
          set +e
          python3 tools/check_timetable_freshness.py > freshness.txt 2>&1
          rc=$?
          cat freshness.txt
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          # 0 fresh, 1 window closing: both are answers, not job failures.
          # 2 means the header could not be read -- that IS a failure.
          [ "$rc" -le 1 ]

      - name: Open a tracking issue if the window is closing
        if: steps.check.outputs.rc == '1'
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: "Timetable validity window closing -- check for a new Caltrain GTFS feed"
        run: |
          existing=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open \
                       --search "\"$TITLE\" in:title" --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            echo "Issue #$existing already open; leaving it as the single tracking item."
            exit 0
          fi
          {
            echo "The weekly timetable watch found the compiled schedule's validity window closing:"
            echo
            echo '```'
            sed 's/^::error:://' freshness.txt
            echo '```'
            echo
            echo "Source of truth: \`tools/check_timetable_freshness.py\`. Procedure: [Keeping the timetable current](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/blob/main/docs/DEVELOPMENT.md#keeping-the-timetable-current)."
            echo
            echo "_Opened by \`.github/workflows/timetable-watch.yml\`, run ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}._"
          } > body.md
          gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body-file body.md
