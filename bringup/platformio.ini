; -----------------------------------------------------------------------------
; Bring-up smoke test — Elecrow CrowPanel 3.5" HMI (ESP32-WROVER-B, ILI9488 SPI,
; XPT2046 resistive touch, 480x320). Amazon ASIN B0FXLB5CFL.
;
; SELF-CONTAINED throwaway project to prove the toolchain + board BEFORE any real
; firmware. Pulls in only TFT_eSPI (the lib Elecrow documents for this board) —
; no LVGL, no OBD, none of the unfinished src/ modules. Open THIS folder in
; PlatformIO (not firmware/) and Upload.
;
; ---- TWO BOARD REVISIONS -----------------------------------------------------
; Elecrow shipped v2.0 and v2.2 of this board. They SWAP two pins:
;     v2.0:  MISO=12  TOUCH_CS=33
;     v2.2:  MISO=33  TOUCH_CS=12
; Everything else (SCK14 MOSI13 CS15 DC2 RST-1 BL27) is identical.
; The DISPLAY color cycle works on BOTH revs (it never uses the swapped pins).
; Only TOUCH needs the right rev. So:
;     1) Flash the default env:   pio run -e bringup -t upload -t monitor
;     2) Screen lights + cycles colors  -> board + display good.
;     3) If touch is DEAD (no [TOUCH] lines on press), your board is v2.2:
;            pio run -e bringup_v22 -t upload -t monitor
; Check the silkscreen too — it usually prints the rev.
; ------------------------------------------------------------------------------
;
; PINS verified against the OFFICIAL Elecrow repo for this exact WROVER-B board:
;   https://github.com/Elecrow-RD/CrowPanel-3.5-HMI-ESP32-Display-480x320
; (corroborated by RalphBacon/269-Elecrow-3.5-TFT-with-ESP32-built-in)
; TFT_eSPI config is injected via build_flags so we never edit the library's
; User_Setup.h (cleaner + survives lib reinstalls).
; -----------------------------------------------------------------------------

; This unit is CONFIRMED rev v2.2 (touch worked on v2.2 pins, dead on v2.0).
[platformio]
default_envs = bringup_v22

; Common settings shared by both revisions.
[base]
platform = espressif32
board = esp32dev          ; Elecrow docs flash this WROVER-B board as "ESP32 Dev Module"
framework = arduino
monitor_speed = 115200
lib_deps =
    bodmer/TFT_eSPI@^2.5.43
build_flags =
    ; --- TFT_eSPI: pins identical across revisions --------------------------
    -D USER_SETUP_LOADED=1
    -D ILI9488_DRIVER=1
    -D TFT_WIDTH=480
    -D TFT_HEIGHT=320
    -D TFT_MOSI=13
    -D TFT_SCLK=14
    -D TFT_CS=15
    -D TFT_DC=2
    -D TFT_RST=-1          ; tied to the ESP32 reset line on this board
    -D TFT_BL=27           ; backlight enable (LEDC/PWM-capable for dimming later)
    -D TFT_BACKLIGHT_ON=HIGH
    ; fonts the smoke test draws with
    -D LOAD_GLCD=1
    -D LOAD_FONT2=1
    -D LOAD_FONT4=1
    -D LOAD_GFXFF=1
    -D SMOOTH_FONT=1
    ; SPI clocks (Elecrow-documented values for this panel, Arduino path)
    -D SPI_FREQUENCY=27000000
    -D SPI_READ_FREQUENCY=16000000
    -D SPI_TOUCH_FREQUENCY=2500000

; ---- Default: board revision 2.0 (MISO=12, TOUCH_CS=33) ----------------------
[env:bringup]
extends = base
build_flags =
    ${base.build_flags}
    -D TFT_MISO=12
    -D TOUCH_CS=33

; ---- Fallback: board revision 2.2 (MISO=33, TOUCH_CS=12) ---------------------
; Use this if the display works but touch is dead on the default env.
[env:bringup_v22]
extends = base
build_flags =
    ${base.build_flags}
    -D TFT_MISO=33
    -D TOUCH_CS=12
