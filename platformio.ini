; -----------------------------------------------------------------------------
; Caltrain Notifier — two board families:
;
;   caltrain, caltrain_v20   Elecrow CrowPanel 3.5" HMI, ILI9488 480x320 SPI
;                            (Amazon ASIN B0FXLB5CFL), revisions 2.2 and 2.0
;   caltrain_es3c28p         QDtech ES3C28P 2.8", ESP32-S3, ILI9341V 320x240 SPI
;                            (Hosyond, Amazon ASIN B0FKG7WRWV) — see its env
;
; Per-board screen geometry lives in src/layout.h, selected by BOARD_ES3C28P.
;
; ---- WHAT THE CROWPANEL ACTUALLY IS ------------------------------------------
; Read off the board itself, because the vendor listing disagrees — see the
; `[CHIP]` line src/main.cpp prints on every boot:
;
;   reported : ESP32-D0WD rev 1.01, 2 cores, 240 MHz, 8 MB flash
;   listing  : "ESP32-WROVER-B, 4 MB flash, 8 MB PSRAM"
;
; The flash is 8 MB, not 4, so this uses the 8 MB partition layout. PSRAM was
; never confirmed: the bring-up build did not enable it, so its report of zero
; proves nothing either way. Nothing here needs it — the display is drawn
; directly rather than through LVGL, and the largest API response measured is
; about 3 KB — so BOARD_HAS_PSRAM is deliberately left undefined rather than
; enabled on a guess. If a future feature wants it, define the flag and check.
;
; ---- BOARD REVISION MATTERS AGAIN --------------------------------------------
; Elecrow shipped v2.0 and v2.2, which swap two pins:
;     v2.0:  TFT_MISO=12  TOUCH_CS=33
;     v2.2:  TFT_MISO=33  TOUCH_CS=12
;
; Touch is used ONLY to wake the screen — a pressure reading, never a
; coordinate — so there is no calibration to do. But reading the XPT2046 needs
; both of the swapped pins, so the build is revision-specific.
;
; The unit on hand is v2.2, confirmed by bringup/ (display worked on both, touch
; only on v2.2). Build -e caltrain_v20 for the older revision.
; -----------------------------------------------------------------------------

[platformio]
default_envs = caltrain

[base]
; PINNED, not bare. A bare `espressif32` resolves to whatever platform happens to
; be installed — and a global pioarduino install silently shadows the name and
; swaps the Arduino core from 2.x to 3.x. That failure is invisible until a
; core-3-only symbol fails to compile, or until the LEDC backlight API changes
; shape underneath the same source.
platform = espressif32@7.0.1
framework = arduino
monitor_speed = 115200

build_unflags = -std=gnu++11   ; the Arduino framework defaults to C++11; src/ needs C++17

; PINNED EXACTLY, no carets. A caret range means the same commit can produce a
; different binary next month, so a dependency change arrives with no diff and
; no review. Dependabot has no PlatformIO ecosystem, so nothing proposes bumps
; automatically — treat a bump as a change that needs a device build.
lib_deps =
    bodmer/TFT_eSPI@2.5.43
; ArduinoJson is NOT listed here on purpose — see third_party/ArduinoJson.h,
; pinned at v7.1.0 and committed so host and device build the identical parser.

; ---- Build-flag fragments shared by every board ------------------------------
; Each board assembles its build_flags as: head, its own panel flags, fonts, its
; own SPI clocks, tail. That is the order the flags had when they all lived in
; [base], and keeping it is part of what keeps the CrowPanel binaries
; byte-identical across this split — do not reorder.
;
; A section of its own rather than more keys in [base]: every env `extends`
; [base], and would otherwise inherit these as unknown options.
[flags]
head =
    -std=gnu++17
    ; Keep the builder's home directory out of the binary. __FILE__ and the
    ; assert machinery bake absolute paths in; a stock build of this project
    ; contains ~21 copies of /home/<user>/.platformio/... which `strings` will
    ; happily recover from a published .bin. Nothing is published from this
    ; repository today, but the leak is created at compile time, not at
    ; release time.
    ; Both maps are needed: PROJECT_DIR covers src/, packages_dir covers the
    ; Arduino core, which PlatformIO compiles from the toolchain directory under
    ; the builder's home. The core is where all of the leaked paths came from.
    -ffile-prefix-map=${PROJECT_DIR}=.
    -fmacro-prefix-map=${PROJECT_DIR}=.
    -ffile-prefix-map=${platformio.packages_dir}=/pkg
    -fmacro-prefix-map=${platformio.packages_dir}=/pkg
    ; --- TFT_eSPI, configured entirely from here -----------------------------
    ; USER_SETUP_LOADED makes the library skip its own User_Setup.h, so we never
    ; edit a file inside .pio/libdeps that a reinstall would silently discard.
    -D USER_SETUP_LOADED=1
fonts =
    -D LOAD_GLCD=1
    -D LOAD_FONT2=1
    -D LOAD_FONT4=1
    -D LOAD_FONT6=1
    -D LOAD_FONT7=1
    -D LOAD_GFXFF=1
    -D SMOOTH_FONT=1
tail =
    ; ArduinoJson is vendored as a single header in third_party/ rather than
    ; fetched. The host test suite parses the same captured API responses with
    ; the same parser, and plain g++ has no way to reach into .pio/libdeps —
    ; so vendoring is what keeps "tested on the host" and "built for the
    ; device" the same code rather than two similar ones.
    -I third_party
    ; Stamp the build date into the binary so a device can be identified on sight.
    !echo "-DFW_DATE=\\\"$(date +%%Y/%%m/%%d)\\\""
    ; OTA release channel (M2, whole-branch review). Shared across every
    ; environment so a channel move is one edit — this used to be duplicated
    ; per-env, which is how a partial update (one env repointed, one left
    ; behind) becomes possible. OTA_ENV stays per-env below: that one MUST
    ; differ between environments, or a board could be handed another board's
    ; image.
    '-D OTA_BASE_URL="https://cheeseprince.github.io/caltrain-notifier/"'

; ---- Elecrow CrowPanel 3.5" (both revisions) ---------------------------------
[crowpanel35]
board = esp32dev            ; Elecrow documents this board as "ESP32 Dev Module"

; The board has 8 MB even though esp32dev defaults to 4. Declaring it is what
; makes the 8 MB partition table legal and lets the bootloader see all of it.
board_build.flash_size = 8MB
board_upload.flash_size = 8MB
; app0/app1 of 3.3 MB each plus 1.5 MB of filesystem. Two app slots keep a
; signed-OTA path open later; the firmware itself stores its settings in NVS.
board_build.partitions = default_8MB.csv

build_flags =
    ${flags.head}
    -D ILI9488_DRIVER=1
    ; TFT_WIDTH / TFT_HEIGHT are deliberately NOT defined. ILI9488_Defines.h sets
    ; them to portrait 320x480; defining them here only earns a redefinition
    ; warning. The app uses its own SCREEN_W/SCREEN_H with setRotation(1).
    -D TFT_MOSI=13
    -D TFT_SCLK=14
    -D TFT_CS=15
    -D TFT_DC=2
    -D TFT_RST=-1              ; tied to the ESP32 reset line on this board
    -D TFT_BL=27               ; backlight — PWM-capable despite Elecrow documenting on/off
    -D TFT_BACKLIGHT_ON=HIGH
    ${flags.fonts}
    ; SPI clocks: Elecrow-documented values for this panel on the Arduino path.
    ; The XPT2046 is a much slower part than the panel and needs its own clock.
    -D SPI_FREQUENCY=27000000
    -D SPI_READ_FREQUENCY=16000000
    -D SPI_TOUCH_FREQUENCY=2500000
    ${flags.tail}

; ---- This unit: revision 2.2 -------------------------------------------------
[env:caltrain]
extends = base, crowpanel35
build_flags =
    ${crowpanel35.build_flags}
    -D TFT_MISO=33
    -D TOUCH_CS=12

    ; OTA support: this environment's name in manifest.txt. OTA_BASE_URL is
    ; shared, set once in [flags] above.
    '-D OTA_ENV="caltrain"'

; ---- The older revision ------------------------------------------------------
; Build this if the display comes up but tapping never wakes the screen.
[env:caltrain_v20]
extends = base, crowpanel35
build_flags =
    ${crowpanel35.build_flags}
    -D TFT_MISO=12
    -D TOUCH_CS=33

    ; OTA support: this environment's name in manifest.txt. OTA_BASE_URL is
    ; shared, set once in [flags] above.
    '-D OTA_ENV="caltrain_v20"'

; ---- QDtech ES3C28P 2.8" (Hosyond) -------------------------------------------
; ESP32-S3 (QFN56), 16 MB flash, 8 MB PSRAM; ILI9341V 240x320 IPS over SPI;
; FT6336G capacitive touch on its own I2C bus. Pins were checked against three
; sources that agree — lcdwiki's table, the vendor's own TFT_eSPI User_Setup.h
; (same TFT_eSPI 2.5.43 pinned above) and an ESP-IDF board support package — and
; the flash and PSRAM types were read off the unit with `esptool.py flash_id`.
;
; Touch does NOT go through TFT_eSPI, so TOUCH_CS is not defined and TFT_eSPI
; prints "TOUCH_CS pin not defined". On THIS board that warning is expected;
; src/display_hw.cpp reads the FT6336G directly and logs [TOUCH] at boot.
[env:caltrain_es3c28p]
extends = base
board = esp32-s3-devkitc-1

; 16 MB: two 6.25 MB app slots, so the signed-OTA layout has room to spare.
; Chosen up front because changing a partition table later needs a USB reflash.
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
; Flash is quad (eFuse: "Flash type set in eFuse: quad"), PSRAM is octal. qio_opi
; describes exactly that; opi_opi is for modules whose flash is octal too.
; PSRAM itself stays disabled (no BOARD_HAS_PSRAM), as on the CrowPanel.
board_build.arduino.memory_type = qio_opi

build_flags =
    ${flags.head}
    ; Serial on the native USB port. Arduino core 2.0.17 defaults this to 0,
    ; which sends Serial to UART0 on GPIO43/44 — nothing reaches /dev/ttyACM0.
    ; ARDUINO_USB_MODE=1 already comes from the board definition.
    -D ARDUINO_USB_CDC_ON_BOOT=1
    ; Selects the 2.8" layout (src/layout.h) and touch driver (src/display_hw.cpp).
    -D BOARD_ES3C28P=1
    -D ILI9341_DRIVER=1
    ; The vendor's configuration for this board. On the S3, TFT_eSPI maps it
    ; to SPI3 (Processors/TFT_eSPI_ESP32_S3.h).
    -D USE_HSPI_PORT=1
    -D TFT_MOSI=11
    -D TFT_SCLK=12
    -D TFT_MISO=13
    -D TFT_CS=10
    -D TFT_DC=46               ; a strapping pin, harmless here: the board boots normally
    -D TFT_RST=-1              ; tied to the ESP32-S3 reset line on this board
    -D TFT_BL=45               ; active high, PWM. Also a strap (VDD_SPI), but eFuse fixes flash at 3.3 V
    -D TFT_BACKLIGHT_ON=HIGH
    ${flags.fonts}
    ; The vendor's SPI clocks for this panel. Fall back to the CrowPanel's
    ; 27000000 if the panel ever shows corruption.
    -D SPI_FREQUENCY=40000000
    -D SPI_READ_FREQUENCY=20000000
    ${flags.tail}
    ; FT6336G capacitive touch (I2C address 0x38). Its INT line (GPIO17) is not
    ; used: the firmware polls.
    -D TOUCH_SDA=16
    -D TOUCH_SCL=15
    -D TOUCH_RST=18

    ; OTA support: this environment's name in manifest.txt.
    '-D OTA_ENV="caltrain_es3c28p"'
